version: '3'

tasks:
  default:
    desc: Alias for check
    cmds:
      - task: check

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  fmt:
    desc: Check formatting — must print nothing
    cmds:
      - gofmt -l .

  fmt:fix:
    desc: Reformat files in place
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet, including integration-tagged files (static only, no database needed)
    cmds:
      - go vet -tags=integration ./...

  lint:
    desc: Run golangci-lint, including integration-tagged files (errcheck, staticcheck, unused, bodyclose, forbidigo, ...)
    cmds:
      - golangci-lint run --build-tags=integration ./...

  lint:fix:
    desc: Run golangci-lint (errcheck, staticcheck, unused, bodyclose, forbidigo, ...)
    cmds:
      - golangci-lint run ./... --fix

  test:
    desc: Run unit tests — must pass without a database
    cmds:
      - go test ./...

  test:race:
    desc: Run unit tests with the race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Run unit tests with coverage
    cmds:
      - go test ./... -cover

  test:integration:
    desc: "Run integration tests against PostgreSQL 18+ — needs TEST_DATABASE_URL, e.g. postgres://postgres@localhost:5432/quotes"
    cmds:
      - go test -tags=integration -race ./...

  check:
    desc: Everything that must be green before calling a step done
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  docker:up:
    desc: Build and start the full stack (Postgres + service + OpenAPI UI) in the background
    cmds:
      - docker compose up -d --build
      - 'echo "Swagger UI: http://localhost:8081"'

  docker:down:
    desc: Stop the stack (add -v via `docker compose down -v` to also drop the database volume)
    cmds:
      - docker compose down

  docker:logs:
    desc: Follow the app container's logs
    cmds:
      - docker compose logs -f app

  smoke:
    desc: Run the end-to-end smoke test against an already-running stack (see docker:up)
    cmds:
      - bash scripts/smoke.sh

  throughput:
    desc: Measure background-pipeline throughput (quote_updates/10s) against an already-running stack
    cmds:
      - bash scripts/throughput.sh
