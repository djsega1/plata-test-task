version: '3'

tasks:
  default:
    desc: Alias for check
    cmds:
      - task: check

  build:
    desc: Build all packages
    cmds:
      - go build ./...

  fmt:
    desc: Check formatting — must print nothing
    cmds:
      - gofmt -l .

  fmt:fix:
    desc: Reformat files in place
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet, including integration-tagged files (static only, no database needed)
    cmds:
      - go vet -tags=integration ./...

  lint:
    desc: Run golangci-lint, including integration-tagged files (errcheck, staticcheck, unused, bodyclose, forbidigo, ...)
    cmds:
      - golangci-lint run --build-tags=integration ./...

  lint:fix:
    desc: Run golangci-lint (errcheck, staticcheck, unused, bodyclose, forbidigo, ...)
    cmds:
      - golangci-lint run ./... --fix

  test:
    desc: Run unit tests — must pass without a database
    cmds:
      - go test ./...

  test:race:
    desc: Run unit tests with the race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Run unit tests with coverage
    cmds:
      - go test ./... -cover

  test:integration:
    desc: Run integration tests against PostgreSQL 18+ — needs TEST_DATABASE_URL, see CLAUDE.md
    cmds:
      - go test -tags=integration -race ./...

  check:
    desc: Everything that must be green before calling a step done
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test
